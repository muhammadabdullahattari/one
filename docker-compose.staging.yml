services:
  api:
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - OTEL_SDK_DISABLED=false
      - METRICS_ENABLED=true

  worker:
    deploy:
      replicas: 2
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - WORKER_CONCURRENCY=8

  scheduler:
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - SCHEDULER_TICK_SECONDS=5

  frontend:
    environment:
      - NODE_ENV=production
