[project]
name = "distributed-task-engine"
version = "0.1.0"
requires-python = ">=3.14"
description = "Event-Driven Distributed Task Processing Engine v5.0"
authors = [{ name = "Task Engine Team" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-api>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-instrumentation-redis>=0.46b0",
  "opentelemetry-exporter-otlp>=1.25",
  "prometheus-client>=0.20",
  "structlog>=24.0",
  "typer>=0.12",
  "supabase>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "boto3>=1.34",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "croniter>=3.0",
  "pytz>=2024.1",
  "email-validator>=2.3.0",
]

[project.scripts]
task-engine = "task_engine.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "testcontainers[postgres,redis]>=4.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-passlib>=1.7",
  "types-pytz>=2024.1",
  "faker>=26.0",
  "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "task_engine"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/persistence/migrations/**" = ["ALL"]
"tests/**" = ["S101", "E501"]


# ── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
