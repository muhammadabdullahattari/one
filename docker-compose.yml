services:
  # ── Backend API Surface ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    image: task-engine-api:latest
    container_name: task-engine-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MODE=dev_jwt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-engine-net

  # ── Asynchronous Worker Runtime ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    image: task-engine-worker:latest
    restart: unless-stopped
    command: ["python3", "-m", "src.sdk.cli", "worker", "start", "--queues", "default,high,low", "--concurrency", "4"]
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-engine-net

  # ── Distributed Cron Scheduler Daemon ─────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scheduler
    image: task-engine-scheduler:latest
    container_name: task-engine-scheduler
    restart: unless-stopped
    command: ["python3", "-m", "src.sdk.cli", "scheduler", "start"]
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-engine-net

  # ── Frontend Next.js Management Console ───────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: task-engine-frontend:latest
    container_name: task-engine-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://api:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - task-engine-net

  # ── Persistent Storage: PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: task-engine-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task-engine-net

  # ── In-Memory Broker: Redis Streams ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: task-engine-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task-engine-net

  # ── Observability: Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: task-engine-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - task-engine-net

  # ── Observability: Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: task-engine-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - task-engine-net

networks:
  task-engine-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
